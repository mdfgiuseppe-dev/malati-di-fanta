<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Reset Cache</title>
<style>
body { font-family: system-ui; padding: 40px; text-align: center; background: #1a1a1a; color: #fff; }
h1 { color: #10b981; }
p { font-size: 16px; margin: 20px 0; }
.spinner { display: inline-block; width: 40px; height: 40px; border: 4px solid #10b981; border-top: 4px solid transparent; border-radius: 50%; animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<h1>🔄 Pulizia cache in corso...</h1>
<div class="spinner"></div>
<p>Cancellando tutte le cache e i Service Worker...</p>
<script>
// Cancella TUTTE le cache
if ('caches' in window) {
  caches.keys().then(names => {
    console.log('Cancellando cache:', names);
    Promise.all(names.map(name => caches.delete(name))).then(() => {
      console.log('Cache cancellata');
      continua();
    });
  });
} else {
  continua();
}

function continua() {
  // Unregistra Service Worker
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.getRegistrations().then(regs => {
      console.log('Unregistrando Service Worker');
      Promise.all(regs.map(reg => reg.unregister())).then(() => {
        console.log('Service Worker unregistrato');
        pulisciLocalStorage();
      });
    });
  } else {
    pulisciLocalStorage();
  }
}

function pulisciLocalStorage() {
  // Cancella SOLO i dati vecchi, mantieni login e credenziali
  console.log('Pulendo localStorage');
  var keysToRemove = [];
  for (var i = 0; i < localStorage.length; i++) {
    var key = localStorage.key(i);
    if (key && (key.startsWith('adm_logo_') || key.startsWith('adm_trofeo_') ||
                key.startsWith('admin_tornei') || key.startsWith('admin_users'))) {
      keysToRemove.push(key);
    }
  }
  keysToRemove.forEach(key => localStorage.removeItem(key));

  // Aspetta 1 secondo e ridirige
  setTimeout(() => {
    console.log('Reindirizzando al sito principale...');
    window.location.href = '/malati-di-fanta/?t=' + Date.now();
  }, 1000);
}
</script>
</body>
</html>
